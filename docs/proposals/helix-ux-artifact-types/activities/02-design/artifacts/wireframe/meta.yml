# Metadata for Wireframe (PROPOSED)

artifact:
  name: Wireframe
  id: wireframe
  type: document
  activity: design
  level: story
  optional: true

voice: artifact-signal

description: |
  Annotated wireframes for one screen (or modal) at each supported size class.
  The layout is a sketch or image; the annotations are numbered callouts kept
  outside the drawing, one per interactive element and per layout decision.
  Annotation depth scales with the stated fidelity, from ideas (sketch) to a
  full interaction, content and state specification (high). It records layout
  and element behavior for one screen; the screen flow owns transitions and the
  interaction-state diagram owns states.

output:
  location: docs/helix/02-design/wireframes/WF-{id}-{screen}.md
  format: markdown
  naming: WF-{number}-{screen-name}.md
  examples:
    - WF-011-invoice.md
    - WF-012-review-queue.md
  assets: docs/helix/02-design/wireframes/assets/WF-{id}-{size-class}.{svg|png}

id_format:
  prefix: WF
  pattern: "WF-[0-9]{3}"
  example: WF-011
  description: |
    Wireframes use WF-XXX identifiers, one per screen or modal, unique across
    the project. All size classes of a screen live in the same instance.

reuse_policy: |
  Update in place and raise the fidelity field as the design matures. Do not
  keep parallel low- and high-fidelity instances of the same screen.

validation:
  required_sections:
    - scope_and_fidelity
    - layouts
    - annotations
    - states_covered
    - accessibility

  required_fields:
    - "Fidelity: sketch | low | mid | high"
    - "Annotation table columns: #, Element, Kind, Annotation, Size classes, Links"

  quality_checks:
    - check: fidelity_stated
      description: The fidelity level is stated and the annotation depth matches it (sketch ideas; low layout decisions; mid functionality; high interaction, content and state)
      severity: blocking

    - check: numbered_callouts
      description: Annotations are numbered callouts referenced from the drawing, not text written inside the layout
      severity: blocking

    - check: every_interactive_element_annotated
      description: Every interactive element in every layout has a callout naming what it does (action ID or transition ID from the screen flow)
      severity: blocking

    - check: size_classes_covered
      description: There is one layout per size class the screen supports, and callouts note what changes between them
      severity: blocking

    - check: states_covered
      description: The states the screen supports are listed with a layout or a link to the interaction-state diagram for each
      severity: blocking

    - check: accessibility_noted
      description: Focus order, accessible names for icon-only controls, headings and landmarks, and target size are noted (depth by fidelity)
      severity: warning

    - check: plain_language
      description: Annotations use plain language and the product's own terms; no internal jargon or component internals
      severity: warning

    - check: no_visual_spec
      description: Colors, type and spacing reference DESIGN.md tokens rather than defining values
      severity: warning

  pattern_checks:
    - pattern: "WF-[0-9]{3}"
      expected: ">=1"
      message: Must use numbered WF naming

    - pattern: "Fidelity\\*\\*: (sketch|low|mid|high)"
      expected: ">=1"
      message: State the fidelity level

    - pattern: "\\[TBD\\]|\\[TODO\\]|\\[NEEDS CLARIFICATION"
      expected: 0
      message: Resolve uncertainty that materially affects the screen

variables:
  - name: screen_id
    description: Screen or modal node ID from the screen flow
    required: true

  - name: fidelity
    description: sketch | low | mid | high
    required: true

  - name: size_classes
    description: Size classes the screen supports
    required: true

prompts:
  generation: prompt.md
  review: |
    Review this wireframe for:
    1. Fidelity stated and annotation depth matching it
    2. Numbered callouts outside the drawing
    3. Every interactive element annotated and linked to a screen-flow action
    4. One layout per supported size class, with differences called out
    5. States covered or linked to the interaction-state diagram
    6. Accessibility notes: focus order, names, headings and landmarks, target size
    7. Plain language; tokens referenced, not redefined

template:
  file: template.md
  sections:
    - scope_and_fidelity: "Screen, governing artifacts, fidelity, size classes."
    - layouts: "One drawing per size class with callout numbers on it."
    - annotations: "Numbered callouts, depth by fidelity."
    - states_covered: "Which states have layouts here and which are in the state diagram."
    - accessibility: "Focus order, accessible names, headings and landmarks, target size."

example:
  file: example.md

references:
  - title: "Annotated Wireframes"
    file: docs/resources/annotated-wireframes.md
    relationship: "Grounds numbered callouts, annotating every interactive element, plain language, and annotation depth scaled to fidelity"

workflow:
  creation_order: 3
  review_cycles: 1-2
  update_triggers:
    - The screen's actions or states change in the screen flow or state diagram
    - A size class is added or dropped
    - A usability evaluation finding targets this screen

relationships:
  informed_by:
    - screen-flow
    - user-stories
    - design-system

  informs:
    - technical-design
    - interaction-state-diagram
    - story-test-plan
    - usability-evaluation-report

  references:
    - solution-design

tags:
  - design
  - ux
  - wireframe
  - annotation
  - layout
  - proposed

version: 0.1.0
