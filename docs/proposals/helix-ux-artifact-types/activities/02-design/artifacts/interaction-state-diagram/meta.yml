# Metadata for Interaction State Diagram (PROPOSED)

artifact:
  name: Interaction State Diagram
  id: interaction-state-diagram
  type: document
  activity: design
  level: story
  optional: true

voice: artifact-signal

description: |
  A statechart for one screen or component that names every UI state it can
  be in, the events and guards that move it between them, and, per state, what
  the user sees, which action is available and what a screen reader announces.
  The state set starts from the UI Stack (ideal, empty, loading, partial,
  error) and adds offline, slow, permission-denied and success/confirmation
  where they apply. Every state is explored on purpose, so none is left to
  chance in the build.

output:
  location: docs/helix/02-design/state-diagrams/ISD-{id}-{name}.md
  format: markdown
  naming: ISD-{number}-{screen-or-component}.md
  examples:
    - ISD-011-invoice.md
    - ISD-020-assistant-panel.md

id_format:
  prefix: ISD
  pattern: "ISD-[0-9]{3}"
  example: ISD-011
  description: |
    Interaction state diagrams use ISD-XXX identifiers, unique across the
    project. Where a screen has a wireframe, reuse its number (WF-011 and
    ISD-011 describe the same screen).

reuse_policy: |
  One diagram per screen or reusable component, updated in place. A component
  used on several screens gets its own ISD; screens reference it instead of
  repeating its states.

validation:
  required_sections:
    - scope
    - state_inventory
    - statechart
    - state_matrix
    - events_and_transitions

  required_fields:
    - "State matrix columns: State, Entered when, User sees, Available actions, Announcement, Exit"
    - "Transition table columns: From, Event, Guard, To, Effect"

  quality_checks:
    - check: ui_stack_considered
      description: Each of ideal, empty, loading, partial and error is present or marked not-applicable with a reason
      severity: blocking

    - check: extended_states_considered
      description: Offline, slow, permission-denied and success/confirmation are present or marked not-applicable with a reason
      severity: blocking

    - check: every_state_has_exit
      description: Every non-final state has at least one event that leaves it; no state traps the user
      severity: blocking

    - check: every_state_has_action
      description: Every state names the action available to the user, or states that none is needed and why
      severity: blocking

    - check: announcements_defined
      description: Every state change the user cannot see by focus alone names its screen-reader announcement and politeness (polite or assertive)
      severity: blocking

    - check: guards_explicit
      description: Every conditional transition states its guard
      severity: blocking

    - check: diagram_matches_tables
      description: The Mermaid statechart, the state matrix and the transitions table describe the same states and events
      severity: blocking

    - check: data_kept_on_failure
      description: Error states say whether entered data is kept
      severity: warning

    - check: hierarchy_used_where_it_helps
      description: Nested or parallel states are used where a region (panel, form) has its own states, instead of a combinatorial flat list
      severity: warning

  pattern_checks:
    - pattern: "ISD-[0-9]{3}"
      expected: ">=1"
      message: Must use numbered ISD naming

    - pattern: "stateDiagram-v2"
      expected: ">=1"
      message: Must include a Mermaid stateDiagram-v2

    - pattern: "\\[TBD\\]|\\[TODO\\]|\\[NEEDS CLARIFICATION"
      expected: 0
      message: Resolve every state before build

variables:
  - name: subject
    description: Screen node ID or component name
    required: true

prompts:
  generation: prompt.md
  review: |
    Review this interaction state diagram for:
    1. UI Stack states (ideal, empty, loading, partial, error) each present or excluded with a reason
    2. Offline, slow, permission-denied and success present or excluded with a reason
    3. Every state has an exit and an available action
    4. Every unseen state change has an announcement with politeness
    5. Guards stated on conditional transitions
    6. Diagram, matrix and transition table in agreement
    7. Errors keep entered data, or say why not

template:
  file: template.md
  sections:
    - scope: "Screen or component, governing artifacts."
    - state_inventory: "Which standard states apply, and why the others do not."
    - statechart: "Mermaid stateDiagram-v2 with events and guards."
    - state_matrix: "Per state: entered when, user sees, available actions, announcement, exit."
    - events_and_transitions: "Every event with guard, target and effect."

example:
  file: example.md

references:
  - title: "The UI Stack (Scott Hurff)"
    file: docs/resources/ui-stack.md
    relationship: "Grounds the five baseline UI states: ideal, empty, loading, partial, error"
  - title: "Statecharts: all states explored"
    file: docs/resources/statecharts-all-states.md
    relationship: "Grounds Harel statecharts and the practice of enumerating every state and the events that leave it"

workflow:
  creation_order: 4
  review_cycles: 1-2
  update_triggers:
    - A screen or component gains a data source, async action or permission
    - The screen flow adds a feedback state on a transition from this screen
    - A usability evaluation finds a missing or trapping state

relationships:
  informed_by:
    - screen-flow
    - wireframe
    - user-stories
    - design-system

  informs:
    - technical-design
    - story-test-plan
    - usability-evaluation-report

  references:
    - contract

tags:
  - design
  - ux
  - statechart
  - ui-states
  - accessibility
  - proposed

version: 0.1.0
last_updated: 2026-10-21
