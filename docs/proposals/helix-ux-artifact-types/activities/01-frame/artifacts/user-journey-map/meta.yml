# Metadata for User Journey Map (PROPOSED)

artifact:
  name: User Journey Map
  id: user-journey-map
  type: document
  activity: frame
  level: feature
  optional: true

voice: artifact-signal

description: |
  One actor's end-to-end experience of one scenario, laid out in phases with
  the actions, thoughts and emotions in each phase, and the opportunities the
  team commits to own and measure. Each phase links to the user stories and
  acceptance criteria (US-<n>-AC<m>) that deliver it, so the map shows which
  parts of the experience the product intent covers and which it leaves out.
  Create one when a feature spans several stories or screens and the team needs
  to see the whole experience before design. It does not define screens,
  layout or states; those belong in screen-flow, wireframe and
  interaction-state-diagram.

output:
  location: docs/helix/01-frame/journey-maps/UJM-{id}-{name}.md
  format: markdown
  naming: UJM-{number}-{journey-name}.md
  examples:
    - UJM-001-review-a-flagged-invoice.md
    - UJM-002-first-month-close.md

id_format:
  prefix: UJM
  pattern: "UJM-[0-9]{3}"
  example: UJM-001
  description: |
    Journey maps use UJM-XXX identifiers, unique across the project. One map
    per actor and scenario. A current-state map and a future-state map of the
    same scenario are separate instances; the future-state map names the
    current-state map it replaces in ddx.depends_on.

reuse_policy: |
  Update the map in place when stories, ACs or evidence change. Create a new
  instance only for a different actor or scenario.

validation:
  required_sections:
    - actor_and_scenario
    - journey_phases
    - opportunities
    - story_coverage

  required_fields:
    - "Phase table columns: Phase, Actions, Thoughts, Emotion, Touchpoints, Stories / ACs"
    - "Opportunity table columns: ID, Opportunity, Phase, Owner, Metric, Target"

  quality_checks:
    - check: single_actor_single_scenario
      description: The map names exactly one actor (a PRD persona) and one scenario with a trigger and an end state
      severity: blocking

    - check: expectations_stated
      description: The actor's goals and expectations are stated before the phases, so phases can be judged against them
      severity: blocking

    - check: phases_cover_trigger_to_outcome
      description: Phases run from the trigger to the end state, including steps outside the product (email, phone, another tool) where the actor takes them
      severity: blocking

    - check: emotion_grounded
      description: Each phase's emotion and thoughts cite evidence (research, support data, assessment finding) or are marked as an assumption
      severity: warning

    - check: phases_traced_to_acs
      description: Every in-product phase lists the US-<n>-AC<m> IDs that deliver it, or is marked uncovered with a reason
      severity: blocking

    - check: opportunities_owned_and_measured
      description: Every opportunity names one owner (role or team) and one metric with a target
      severity: blocking

    - check: no_screen_design
      description: The map does not define screens, layouts, components or states; it links screen-flow, wireframe and interaction-state-diagram IDs instead
      severity: warning

  pattern_checks:
    - pattern: "UJM-[0-9]{3}"
      expected: ">=1"
      message: Must use numbered UJM naming

    - pattern: "US-[0-9]+-AC[0-9]+"
      expected: ">=1"
      message: Phases must trace to stable acceptance-criterion IDs

    - pattern: "\\[TBD\\]|\\[TODO\\]|\\[NEEDS CLARIFICATION"
      expected: 0
      message: Resolve uncertainty or record it as an assumption or open question

variables:
  - name: actor
    description: The PRD persona whose experience is mapped
    required: true

  - name: scenario
    description: The trigger and end state of the journey
    required: true

  - name: map_kind
    description: current-state or future-state
    required: true

prompts:
  generation: prompt.md
  review: |
    Review this journey map for:
    1. One actor, one scenario, explicit goals and expectations
    2. Phases from trigger to end state, including off-product steps
    3. Actions, thoughts and emotions per phase, grounded in evidence or marked as assumptions
    4. Every in-product phase traced to US-<n>-AC<m> IDs, gaps named
    5. Opportunities with one owner and one measurable target each
    6. No screen, layout or state design (links only)

template:
  file: template.md
  sections:
    - actor_and_scenario: "Top zone: actor, scenario, goals and expectations."
    - journey_phases: "Middle zone: phases with actions, thoughts, emotion, touchpoints and the ACs that deliver each."
    - opportunities: "Bottom zone: opportunities with owner, metric and target."
    - insights: "Bottom zone: pain points and moments that matter, with evidence."
    - story_coverage: "Which phases the stories cover, and which they leave uncovered."

example:
  file: example.md

references:
  - title: "NN/g Journey Mapping 101"
    file: docs/resources/nng-journey-mapping.md
    relationship: "Grounds the five elements (actor, scenario and expectations, phases, actions/mindsets/emotions, opportunities) and the three layout zones"

workflow:
  creation_order: 3
  review_cycles: 1
  update_triggers:
    - A user story or acceptance criterion in a mapped phase changes
    - A usability evaluation report finds a problem in a mapped phase
    - New research changes the actor's goals or emotions

relationships:
  informed_by:
    - prd
    - feature-specification
    - user-stories
    - research-plan
    - usability-evaluation-report

  informs:
    - screen-flow
    - solution-design
    - story-test-plan
    - usability-evaluation-report
    - improvement-backlog

  references:
    - stakeholder-map

tags:
  - frame
  - ux
  - journey
  - experience
  - traceability
  - proposed

version: 0.1.0
last_updated: 2026-10-21
