<title>Theme Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Quicksand:wght@400;500;600;700&family=Zilla+Slab:wght@300;500&family=IBM+Plex+Sans:wght@400;600&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: a six-step wizard under one header; each step is one working surface, previews always show the theme in light and dark. */
:root {
  --bg: #ffffff;
  --panel: #f6f8fa;
  --fg: #312a29;
  --muted: #494f5b;
  --line: #d6d4d4;
  --line-strong: #312a29;
  --primary: #312a29;
  --on-primary: #ffffff;
  --secondary: #f7cfa5;
  --on-secondary: #312a29;
  --soft: #fef5ed;
  --cool: #ecf1f5;
  --ok-bg: #c6e1d9;
  --link: #1d6e6f;
  --code-bg: #312a29;
  --code-fg: #fefaf6;
  --focus: #6a888d;
  --font-display: "Zilla Slab", Georgia, serif;
  --font-body: Quicksand, "Helvetica Neue", Helvetica, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1817; --panel: #262120; --fg: #f3ede9; --muted: #c4bdb8; --line: #433c3a; --line-strong: #f3ede9;
    --primary: #f7cfa5; --on-primary: #231e1d; --secondary: #f7cfa5; --on-secondary: #231e1d;
    --soft: #3a2f27; --cool: #2b3036; --ok-bg: #234139; --link: #8fd0c4; --code-bg: #0f0d0c; --code-fg: #f3ede9; --focus: #a1b8ca;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1817; --panel: #262120; --fg: #f3ede9; --muted: #c4bdb8; --line: #433c3a; --line-strong: #f3ede9;
  --primary: #f7cfa5; --on-primary: #231e1d; --secondary: #f7cfa5; --on-secondary: #231e1d;
  --soft: #3a2f27; --cool: #2b3036; --ok-bg: #234139; --link: #8fd0c4; --code-bg: #0f0d0c; --code-fg: #f3ede9; --focus: #a1b8ca;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 300; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4vw, 2.75rem); line-height: 0.95; }
h2 { font-size: 1.25rem; font-weight: 500; }
code, pre { font-family: var(--font-mono); }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 1280px; margin-inline: auto; padding-inline: max(16px, 2.5vw); }
.hdr { border-bottom: 1px solid var(--line); }
.hdr .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; }
.brandmark { display: flex; align-items: baseline; gap: 12px; }
.brandmark b { font-family: var(--font-display); font-weight: 300; font-size: 26px; line-height: 1; }
.hdr nav { display: flex; gap: 18px; font-size: 14px; }
main.wrap { padding-block: 24px 120px; display: flex; flex-direction: column; gap: 24px; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.steps button { width: 100%; min-height: 54px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); text-align: left; cursor: pointer; font-weight: 500; font-size: 14px; }
.steps button[aria-current="step"] { border-color: var(--line-strong); background: var(--soft); }
.steps button:disabled { color: var(--muted); cursor: not-allowed; opacity: .7; }
.steps .n { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--cool); font-family: var(--font-display); font-size: 16px; }
.steps button.done .n, .steps button[aria-current="step"] .n { background: var(--primary); color: var(--on-primary); }

.btn { min-height: 44px; padding: 0 20px; border-radius: 4px; border: 1px solid transparent; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-secondary { background: var(--secondary); color: var(--on-secondary); }
.btn-quiet { background: var(--bg); border-color: var(--line); }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: var(--cool); font-size: 13px; }
.pill.warm { background: var(--soft); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.spread { justify-content: space-between; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.status { margin: 0; padding: 12px 16px; border-radius: 4px; background: var(--ok-bg); font-size: 14px; }
.panel { padding: 20px; border-radius: 4px; background: var(--panel); }
.card { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 4px; border: 2px solid var(--line); background: var(--bg); min-width: 0; }
.card.on { border-color: var(--line-strong); }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 4px; }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 3px; background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--primary); color: var(--on-primary); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; }
.input { min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
textarea.input { padding: 10px 12px; resize: vertical; min-height: 64px; }
.hint { font-size: 13px; color: var(--muted); }
.swatches { display: flex; height: 18px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.swatches span { flex: 1; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pair.single { grid-template-columns: minmax(0, 1fr); }
.badge-aa { font-size: 12px; font-weight: 700; color: var(--link); }
.footbar { position: sticky; bottom: 0; z-index: 5; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.footbar .inner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }

/* Step 1 */
.drop { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 20px; border: 2px dashed #a1b8ca; border-radius: 4px; background: var(--panel); text-align: center; cursor: pointer; }
.drop.over { background: var(--cool); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.chip-in { animation: chipIn .5s ease both; }
@keyframes chipIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.scan { height: 4px; border-radius: 2px; background: var(--cool); overflow: hidden; }
.scan i { display: block; height: 100%; width: 40%; background: var(--primary); animation: scan 0.9s ease-in-out infinite; }
@keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.skeleton { border-radius: 4px; background: linear-gradient(90deg, var(--panel), var(--cool), var(--panel)); background-size: 200% 100%; animation: shimmer 1s linear infinite; min-height: 420px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Compare */
.matrix { overflow-x: auto; }
.matrix-grid { display: grid; gap: 12px; align-items: start; }
.cell { padding: 8px; border-radius: 4px; border: 2px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.cell.chosen { border-color: var(--line-strong); background: var(--soft); }

/* Step 6 */
.use { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); gap: 24px; align-items: start; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { min-height: 40px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.task input[type=checkbox] { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--primary); }
.task h3 { font-size: 1.15rem; font-weight: 500; }
.task.done h3 { text-decoration: line-through; color: var(--muted); }
.task .body { display: flex; flex-direction: column; gap: 10px; grid-column: 2; min-width: 0; }
.code { position: relative; }
.code pre { margin: 0; padding: 14px 16px; padding-right: 76px; border-radius: 4px; background: var(--code-bg); color: var(--code-fg); font-size: 13px; line-height: 1.6; overflow-x: auto; white-space: pre; }
.code .copy { position: absolute; top: 8px; right: 8px; min-height: 30px; padding: 0 10px; border-radius: 3px; border: 1px solid #6f6a69; background: transparent; color: var(--code-fg); cursor: pointer; font-size: 12px; }
.file { font-size: 12px; color: var(--muted); }
.progress { height: 8px; border-radius: 4px; background: var(--cool); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--link); transition: width .3s ease; }
.aside { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }
.files li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.files { list-style: none; margin: 0; padding: 0; }
.kbd-verify { font-size: 13px; }

.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade, .chip-in, .scan i, .skeleton { animation: none; } }
@media (max-width: 900px) {
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .use { grid-template-columns: minmax(0, 1fr); }
  .aside { position: static; }
  .two { grid-template-columns: minmax(0, 1fr) !important; }
}
@media (max-width: 520px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pair { grid-template-columns: minmax(0, 1fr); } }
</style>

<header class="hdr">
  <div class="wrap">

  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

  function previews(opt, s) {

  // ---------- state ----------
  const state = {
    step: 1, uploaded: false, scanning: false, round: 1, regenerating: false,
    palettes: {}, systems: {}, final: null, view: 'both',
    themeName: 'acme-legal-carbon', saving: false, saved: false,

  };
  const opts = () => ROUNDS[state.round];

  const finalPair = () => {
    const [pid, sid] = (state.final || '').split(':');

  };
  const set = (patch) => { Object.assign(state, patch); render(); };

  // ---------- views ----------
  let FADE = 'fade';
  const STEP_LABELS = ['Upload logo', 'Pick palettes', 'Pick design systems', 'Compare', 'Save theme', 'Use in your app'];
  function stepper() {

  function step1() {
    const chips = state.uploaded ? EXTRACTED.map((c, i) => `<li class="row chip-in" style="animation-delay:${i * 180}ms"><span style="width:36px;height:24px;border-radius:4px;border:1px solid var(--line);background:${c.hex}"></span><code>${c.hex}</code><span class="hint">${c.role} · ${c.cover} of the logo</span></li>`).join('') : '';

  function step2() {

      <div class="row spread" style="align-items:flex-end">

  function step3() {
    const first = chosenP()[0] || opts()[0];

        code: [['browser console', `getComputedStyle(document.documentElement)\n  .getPropertyValue("--piq-color-accent")   // "${finalPair().opt.light.accent}"`]] }
    ];

  function step6() {

          </div>
          <div class="panel" style="display:flex;flex-direction:column;gap:8px">
            <span class="eyebrow">Files you'll touch</span>
            <ul class="files">${files.map((f) => `<li><code>${f}</code></li>`).join('')}</ul>
          </div>
          <div class="panel" style="display:flex;flex-direction:column;gap:10px">
            <span class="eyebrow">Using a coding agent?</span>
            <span class="hint">Paste this into Claude Code in your app's repository.</span>
            ${code('agent', agent)}
          </div>
        </aside>
      </div>
    </section>`;
  }

  // ---------- render + events ----------
  const app = document.getElementById('app');
  let lastStep = null;
  function render() {
    FADE = state.step !== lastStep ? 'fade' : '';
    lastStep = state.step;
    const body = [null, step1, step2, step3, step4, step5, step6][state.step]();
    const y = window.scrollY;
    app.innerHTML = stepper() + body;
    if (state.keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
    state.keepScroll = false;
  }
  const keep = (patch) => { state.keepScroll = true; set(patch); };

  function useLogo(name, html) {
    set({ uploaded: true, scanning: true, logoName: name, logoHtml: html });
    setTimeout(() => keep({ scanning: false }), 1200);
  }
  app.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-done]');
    if (!t) return;
    if (t.dataset.go) return set({ step: +t.dataset.go });
    if (t.id === 'use-sample') return useLogo('acme-legal-logo.svg', null);
    if (t.id === 'replace') return set({ uploaded: false });
    if (t.id === 'to-palettes') return set({ step: 2 });
    if (t.dataset.view) return keep({ view: t.dataset.view });
    if (t.dataset.pal) { const id = t.dataset.pal; return keep({ palettes: { ...state.palettes, [id]: !state.palettes[id] } }); }
    if (t.id === 'to-systems') return set({ step: 3 });
    if (t.id === 'to-compare') {
      const P = chosenP(), S = chosenS();
      return set({ step: 4, final: state.final && P.some((o) => state.final.startsWith(o.id + ':')) ? state.final : null });
    }
    if (t.dataset.final) { const [, sid] = t.dataset.final.split(':'); return keep({ final: t.dataset.final, themeName: 'acme-legal-' + sid }); }
    if (t.id === 'to-save') return set({ step: 5 });
    if (t.dataset.fw) return keep({ framework: t.dataset.fw });
    if (t.dataset.copy) {
      const text = document.getElementById('code-' + t.dataset.copy).textContent;
      const done = () => keep({ copied: t.dataset.copy });
      try { navigator.clipboard.writeText(text).then(done, done); } catch { done(); }
    }
  });
  app.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.sys) return keep({ systems: { ...state.systems, [t.dataset.sys]: t.checked } });
    if (t.dataset.done) return keep({ done: { ...state.done, [t.dataset.done]: t.checked } });
    if (t.id === 'logo-file' && t.files[0]) {
      const f = t.files[0], r = new FileReader();
      r.onload = () => useLogo(f.name, `<img src="${r.result}" alt="Uploaded logo" style="width:72px;height:72px;object-fit:contain">`);
      r.readAsDataURL(f);
    }
  });
  app.addEventListener('input', (e) => {
    if (e.target.id === 'feedback') state.feedback = e.target.value;
    if (e.target.id === 'theme-name') {
      state.themeName = e.target.value.trim();
      const hint = document.getElementById('theme-name-hint'), ok = /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(state.themeName);
      hint.innerHTML = ok ? 'Lowercase letters, digits and hyphens.' : '<b style="color:#b3261e">Use lowercase letters, digits and hyphens, starting with a letter.</b>';
      document.getElementById('save').disabled = !ok;
    }
  });
  app.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'feedback-form') {
      keep({ regenerating: true });
      setTimeout(() => keep({ regenerating: false, round: 2 }), 1400);
    }
    if (e.target.id === 'save-form') {
      keep({ saving: true });
      setTimeout(() => set({ saving: false, saved: true, step: 6 }), 1100);
    }
  });
  ['dragover', 'dragleave', 'drop'].forEach((ev) => app.addEventListener(ev, (e) => {
    const drop = e.target.closest && e.target.closest('#drop');
    if (!drop) return;
    e.preventDefault();
    drop.classList.toggle('over', ev === 'dragover');
    if (ev === 'drop' && e.dataTransfer.files[0]) {
      const f = e.dataTransfer.files[0], r = new FileReader();
      r.onload = () => useLogo(f.name, `<img src="${r.result}" alt="Uploaded logo" style="width:72px;height:72px;object-fit:contain">`);
      r.readAsDataURL(f);
    }
  }));
  window.themeBuilder = { state, set };
  render();
})();
</script>
