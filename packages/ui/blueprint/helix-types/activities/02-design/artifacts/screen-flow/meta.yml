# Metadata for Screen Flow (PROPOSED)

artifact:
  name: Screen Flow
  id: screen-flow
  type: document
  activity: design
  level: feature
  optional: true

voice: artifact-signal

description: |
  The user flow (wireflow) for one feature: screens and modals as nodes, the
  actions that move between them as edges, decision points, entry and exit
  points, and every alternate path (error, cancel, empty, permission). Each
  transition names the action and the hotspot that triggers it, and the
  feedback the user sees. It is the focused, generatable home for the flow
  rationale the retired ux-design artifact used to hold; the solution design
  links it by ID instead of restating it.

output:
  location: docs/helix/02-design/screen-flows/SF-{id}-{name}.md
  format: markdown
  naming: SF-{feature-number}-{feature-name}.md
  examples:
    - SF-004-invoice-review.md

id_format:
  prefix: SF
  pattern: "SF-[0-9]{3}"
  example: SF-004
  description: |
    Screen flows use SF-XXX identifiers. The number matches the governing
    FEAT-XXX so one feature has one screen flow.

reuse_policy: |
  One screen flow per feature, updated in place as screens, actions or
  alternate paths change. Split only when the feature is split.

validation:
  required_sections:
    - scope
    - nodes
    - flow_diagram
    - transitions
    - alternate_paths
    - journey_traceability

  required_fields:
    - "Node table columns: ID, Kind, Title, Purpose, Stories"
    - "Transition table columns: ID, From, Action (hotspot), Guard, To, Feedback, Changed region"

  quality_checks:
    - check: entry_and_exit_defined
      description: The flow names at least one entry node and at least one exit, and every node is reachable from an entry
      severity: blocking

    - check: every_transition_has_action
      description: Every edge names the action that triggers it and its hotspot (the control the user activates), not just an arrow
      severity: blocking

    - check: decisions_explicit
      description: Every branch is a decision node or a guarded transition with its condition stated
      severity: blocking

    - check: alternate_paths_covered
      description: Every action that can fail, be cancelled or return nothing has an error, cancel or empty path, or a stated reason it cannot occur
      severity: blocking

    - check: feedback_shown
      description: Every transition that changes data or waits on the system names the feedback state the user sees (progress, success, error, undo)
      severity: blocking

    - check: changed_region_named
      description: For transitions that update part of a screen (panel, modal, inline message) rather than replace it, the changed region is named
      severity: warning

    - check: fidelity_matched
      description: The stated fidelity matches the purpose (boxes for structure, wireframe thumbnails for layout review) and does not specify visual design
      severity: warning

    - check: diagram_matches_table
      description: The Mermaid diagram and the transitions table describe the same nodes and edges
      severity: blocking

    - check: journeys_traced
      description: Every user journey and alternate maps to a path of transition IDs and the ACs it proves
      severity: blocking

  pattern_checks:
    - pattern: "SF-[0-9]{3}"
      expected: ">=1"
      message: Must use numbered SF naming

    - pattern: "```mermaid"
      expected: ">=1"
      message: Must include a Mermaid flowchart

    - pattern: "US-[0-9]+-AC[0-9]+"
      expected: ">=1"
      message: Journeys must trace to stable acceptance-criterion IDs

    - pattern: "\\[TBD\\]|\\[TODO\\]|\\[NEEDS CLARIFICATION"
      expected: 0
      message: Resolve uncertainty that materially affects the flow

variables:
  - name: feature_id
    description: Governing FEAT-XXX
    required: true

  - name: fidelity
    description: boxes | thumbnails | annotated-wireframes
    required: true

prompts:
  generation: prompt.md
  review: |
    Review this screen flow for:
    1. Entry and exit points, every node reachable
    2. Every transition naming its action and hotspot, guard and feedback
    3. Error, cancel, empty and permission paths for every action that can need them
    4. Changed region named for partial updates
    5. Diagram and transitions table in agreement
    6. Every journey and alternate traced to transitions and ACs
    7. No layout or visual design (wireframe owns layout; DESIGN.md owns tokens)

template:
  file: template.md
  sections:
    - scope: "Feature, governing artifacts, fidelity and size classes."
    - nodes: "Screens, modals, panels and external exits."
    - flow_diagram: "Mermaid flowchart of nodes, decisions and edges."
    - transitions: "One row per edge: action and hotspot, guard, target, feedback, changed region."
    - alternate_paths: "Error, cancel, empty, permission and offline paths."
    - journey_traceability: "Each journey as a path of transitions and the ACs it proves."

example:
  file: example.md

references:
  - title: "NN/g Wireflows"
    file: docs/resources/nng-wireflows.md
    relationship: "Grounds showing feedback states, marking the hotspot per transition, showing only the changed region, and matching fidelity to purpose"

workflow:
  creation_order: 2
  review_cycles: 1-2
  update_triggers:
    - A screen, modal or action is added, removed or retargeted
    - A user story's walkthrough or ACs change
    - A usability evaluation finds a dead end or missing path

relationships:
  informed_by:
    - feature-specification
    - user-stories
    - user-journey-map
    - design-system

  informs:
    - solution-design
    - technical-design
    - wireframe
    - interaction-state-diagram
    - story-test-plan
    - usability-evaluation-report

  references:
    - architecture

tags:
  - design
  - ux
  - user-flow
  - wireflow
  - navigation
  - proposed

version: 0.1.0
last_updated: 2026-10-21
