# Usability test kit: a docs/ux type of the guided design loop (FEAT-018, CONTRACT-008).
# Stage 1 home; mapped into HELIX in stage 2.

type: test-kit
name: Usability test kit
description: |
  Everything needed to test the journeys with real people: tasks phrased
  as goals with no interface words, success criteria from the acceptance
  criteria, a facilitator script, a consent note, a screener and an
  observation sheet.
id:
  prefix: TK
  pattern: "^TK-[1-9][0-9]*$"
  example: TK-1
output: docs/ux/tests/TK-<n>/kit.md
sections:
    - Scenarios
    - Success criteria
    - Facilitator script
    - Consent
    - Screener
    - Observation sheet
rules: []
