# Production insights: a docs/ux type of the guided design loop (FEAT-018, CONTRACT-008).
# Stage 1 home; mapped into HELIX in stage 2.

type: insights
name: Production insights
description: |
  What production data says about each journey: completion, abandonment
  by step, failed searches, time per step, and support and feedback
  matched to journeys. Read from files the owner exported; ux-builder
  fetches nothing (ADR-038).
id:
  prefix: INS
  pattern: "^INS-[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  example: INS-2026-10-23
output: docs/ux/insights/INS-<yyyy-mm-dd>.md
sections:
    - Sources
    - Journeys
    - Unmatched events
    - Diagnosis
rules: []
