# Experiment: a docs/ux type of the guided design loop (FEAT-018, CONTRACT-008).
# Stage 1 home; mapped into HELIX in stage 2.

type: experiment
name: Experiment
description: |
  One production experiment: the hypothesis and the decision it tests,
  the variant, the success and guardrail metrics, how long it runs, the
  result and what was decided. Opened only after the experiment
  checkpoint.
id:
  prefix: EXP
  pattern: "^EXP-[1-9][0-9]*$"
  example: EXP-1
output: docs/ux/experiments/EXP-<n>.md
sections:
    - Hypothesis
    - Variant
    - Metrics
    - Duration
    - Result
    - Decision
rules: []
