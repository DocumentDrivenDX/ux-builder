# Experience brief: a docs/ux type of the guided design loop (FEAT-018, CONTRACT-008).
# Stage 1 home; mapped into HELIX in stage 2.

type: experience-brief
name: Experience brief
description: |
  What the app is for, for whom, and how its experience should feel,
  with every point marked confirmed, assumed or hypothesis. A living
  document, regenerated whenever the PRD, the stories or the design
  state change.
id:
  prefix: brief
  pattern: "^brief$"
  example: brief
output: docs/ux/brief.md
sections:
    - Product
    - Target users
    - Primary outcome
    - Primary jobs
    - Experience principles
    - Constraints
    - Open questions
rules: []
