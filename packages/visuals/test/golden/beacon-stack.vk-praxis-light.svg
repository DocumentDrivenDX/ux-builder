<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1029 582" width="1029" height="582" role="img" aria-labelledby="beacon-stack-title" aria-describedby="beacon-stack-desc" class="uxb-visual uxb-visual--structure-stack" data-visual="beacon-stack" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="beacon-stack-title">Where each piece sits</title>
<desc id="beacon-stack-desc">Beacon's own code is one band between the front door and the platform.</desc>
<rect x="0" y="0" width="1029" height="582" style="fill:#F0EEE6"/>
<g id="beacon-stack--layer_layer-people" class="uxb-group" data-role="layer">
<rect x="0" y="0" width="1028.5" height="88" rx="8" style="fill:#EBE9E1"/>
<text x="16" y="28" style="fill:#3D3D3A;font-size:12px;font-weight:600">People</text>
</g>
<g id="beacon-stack--agent" class="uxb-node" data-role="actor" data-status="built">
<rect x="127.5" y="25" width="153" height="38" rx="8" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<circle cx="150.5" cy="41.4" r="3.96" style="fill:none;stroke:#706C62;stroke-width:1.5px"/>
<path d="M143.664 54 C143.664 47.16 157.344 47.16 157.344 54" style="fill:none;stroke:#706C62;stroke-width:1.5px"/>
<text x="165.5" y="49" style="fill:#141413;font-size:14px;font-weight:600">Support agent</text>
</g>
<g id="beacon-stack--admin" class="uxb-node" data-role="actor" data-status="built">
<rect x="294.5" y="16" width="181" height="56" rx="8" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<circle cx="317.5" cy="32.4" r="3.96" style="fill:none;stroke:#706C62;stroke-width:1.5px"/>
<path d="M310.66400000000004 45 C310.66400000000004 38.16 324.344 38.16 324.344 45" style="fill:none;stroke:#706C62;stroke-width:1.5px"/>
<text x="332.5" y="40" style="fill:#141413;font-size:14px;font-weight:600">Workspace admin</text>
<text x="332.5" y="54" style="fill:#6B675E;font-size:12px;font-weight:400">sets policies and rules</text>
</g>
<g id="beacon-stack--layer_layer-front-door" class="uxb-group" data-role="layer">
<rect x="0" y="94" width="1028.5" height="104" rx="8" style="fill:#E7E5DD"/>
<text x="16" y="122" style="fill:#3D3D3A;font-size:12px;font-weight:600">Front door</text>
</g>
<g id="beacon-stack--idp" class="uxb-node" data-role="platform" data-status="built">
<rect x="127.5" y="118" width="147" height="56" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="141.5" y="142" style="fill:#141413;font-size:14px;font-weight:600">Identity provider</text>
<text x="141.5" y="156" style="fill:#3D3D3A;font-size:12px;font-weight:400">single sign-on</text>
</g>
<g id="beacon-stack--proxy" class="uxb-node" data-role="platform" data-status="built">
<rect x="288.5" y="110" width="195" height="72" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="302.5" y="134" style="fill:#141413;font-size:14px;font-weight:600">Sign-in proxy</text>
<text x="302.5" y="148" style="fill:#3D3D3A;font-size:12px;font-weight:400">checks identity, forwards the</text>
<text x="302.5" y="164" style="fill:#3D3D3A;font-size:12px;font-weight:400">agent's token</text>
</g>
<g id="beacon-stack--layer_layer-beacon" class="uxb-group" data-role="layer">
<rect x="0" y="204" width="1028.5" height="190" rx="8" style="fill:#EBE9E1"/>
<text x="16" y="232" style="fill:#3D3D3A;font-size:12px;font-weight:600">Beacon</text>
</g>
<g id="beacon-stack--web" class="uxb-node" data-role="own" data-status="built">
<rect x="127.5" y="228" width="221" height="56" rx="8" style="fill:#FFFFFF;stroke:#D12800;stroke-width:2px"/>
<text x="141.5" y="252" style="fill:#141413;font-size:14px;font-weight:600">Web app</text>
<text x="141.5" y="266" style="fill:#6B675E;font-size:12px;font-weight:400">the agent's inbox and draft editor</text>
</g>
<g id="beacon-stack--api" class="uxb-node" data-role="own" data-status="built">
<rect x="362.5" y="228" width="211" height="56" rx="8" style="fill:#FFFFFF;stroke:#D12800;stroke-width:2px"/>
<text x="376.5" y="252" style="fill:#141413;font-size:14px;font-weight:600">Beacon API</text>
<text x="376.5" y="266" style="fill:#6B675E;font-size:12px;font-weight:400">every request runs as the agent</text>
</g>
<g id="beacon-stack--drafter" class="uxb-node" data-role="own" data-status="built">
<rect x="587.5" y="220" width="221" height="72" rx="8" style="fill:#FFFFFF;stroke:#D12800;stroke-width:2px"/>
<text x="601.5" y="244" style="fill:#141413;font-size:14px;font-weight:600">Reply drafter</text>
<text x="601.5" y="258" style="fill:#6B675E;font-size:12px;font-weight:400">builds the prompt from the ticket</text>
<text x="601.5" y="274" style="fill:#6B675E;font-size:12px;font-weight:400">and its history</text>
</g>
<g id="beacon-stack--worker" class="uxb-node" data-role="own" data-status="built">
<rect x="822.5" y="220" width="190" height="72" rx="8" style="fill:#FFFFFF;stroke:#D12800;stroke-width:2px"/>
<text x="836.5" y="244" style="fill:#141413;font-size:14px;font-weight:600">Job worker</text>
<text x="836.5" y="258" style="fill:#6B675E;font-size:12px;font-weight:400">imports, re-indexing, nightly</text>
<text x="836.5" y="274" style="fill:#6B675E;font-size:12px;font-weight:400">digests</text>
</g>
<g id="beacon-stack--rules" class="uxb-node" data-role="own" data-status="placeholder">
<rect x="127.5" y="306" width="204" height="72" rx="8" style="fill:#FAEAE6;stroke:#D12800;stroke-width:2px"/>
<text x="141.5" y="330" style="fill:#141413;font-size:14px;font-weight:600">Policy rules</text>
<text x="141.5" y="344" style="fill:#3D3D3A;font-size:12px;font-weight:400">a fixed allow-list until the rules</text>
<text x="141.5" y="360" style="fill:#3D3D3A;font-size:12px;font-weight:400">engine lands</text>
</g>
<g id="beacon-stack--layer_layer-beacon-data" class="uxb-group" data-role="layer">
<rect x="0" y="400" width="1028.5" height="88" rx="8" style="fill:#E7E5DD"/>
<text x="16" y="428" style="fill:#3D3D3A;font-size:12px;font-weight:600">Beacon data</text>
</g>
<g id="beacon-stack--db" class="uxb-node" data-role="store" data-status="built">
<rect x="127.5" y="416" width="181" height="56" rx="8" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<path d="M141.504 430 L141.504 442 C141.504 446 159.504 446 159.504 442 L159.504 430" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<ellipse cx="150.5" cy="430" rx="9" ry="3" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<text x="165.5" y="440" style="fill:#141413;font-size:14px;font-weight:600">Beacon database</text>
<text x="165.5" y="454" style="fill:#6B675E;font-size:12px;font-weight:400">tickets, drafts, reviews</text>
</g>
<g id="beacon-stack--queue" class="uxb-node" data-role="store" data-status="built">
<rect x="322.5" y="425" width="126" height="38" rx="8" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<path d="M336.504 439 L336.504 451 C336.504 455 354.504 455 354.504 451 L354.504 439" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<ellipse cx="345.5" cy="439" rx="9" ry="3" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<text x="360.5" y="449" style="fill:#141413;font-size:14px;font-weight:600">Job queue</text>
</g>
<g id="beacon-stack--files" class="uxb-node" data-role="store" data-status="unknown">
<rect x="462.5" y="416" width="177" height="56" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px;stroke-dasharray:2 3"/>
<path d="M476.504 430 L476.504 442 C476.504 446 494.504 446 494.504 442 L494.504 430" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<ellipse cx="485.5" cy="430" rx="9" ry="3" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="500.5" y="440" style="fill:#3D3D3A;font-size:14px;font-weight:600">Attachment store</text>
<text x="500.5" y="454" style="fill:#3D3D3A;font-size:12px;font-weight:400">object storage</text>
</g>
<g id="beacon-stack--layer_layer-platform" class="uxb-group" data-role="layer">
<rect x="0" y="494" width="1028.5" height="88" rx="8" style="fill:#EBE9E1"/>
<text x="16" y="522" style="fill:#3D3D3A;font-size:12px;font-weight:600">Platform</text>
</g>
<g id="beacon-stack--gateway" class="uxb-node" data-role="platform" data-status="built">
<rect x="127.5" y="510" width="210" height="56" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="141.5" y="534" style="fill:#141413;font-size:14px;font-weight:600">Model gateway</text>
<text x="141.5" y="548" style="fill:#3D3D3A;font-size:12px;font-weight:400">rate limits, usage, model choice</text>
</g>
<g id="beacon-stack--models" class="uxb-node" data-role="platform" data-status="built">
<rect x="351.5" y="519" width="151" height="38" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="365.5" y="543" style="fill:#141413;font-size:14px;font-weight:600">Language models</text>
</g>
<g id="beacon-stack--telemetry" class="uxb-node" data-role="platform" data-status="built">
<rect x="516.5" y="510" width="165" height="56" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="530.5" y="534" style="fill:#141413;font-size:14px;font-weight:600">Telemetry collector</text>
<text x="530.5" y="548" style="fill:#3D3D3A;font-size:12px;font-weight:400">traces and audit spans</text>
</g>
</svg>
