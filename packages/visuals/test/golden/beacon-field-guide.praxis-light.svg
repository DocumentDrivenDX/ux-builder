<text x="40" y="36" style="fill:#6B675E;font-size:12px;font-weight:600;font-family:ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;letter-spacing:0.12em">01 / PEOPLE</text>
</g>
<g id="beacon-field-guide--front-door" class="uxb-group" data-role="lane">
<text x="341.26" y="36" style="fill:#6B675E;font-size:12px;font-weight:600;font-family:ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;letter-spacing:0.12em">02 / FRONT DOOR</text>
</g>
