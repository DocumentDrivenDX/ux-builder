<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1404 432" width="1404" height="432" role="img" aria-labelledby="beacon-field-guide-title" aria-describedby="beacon-field-guide-desc" class="uxb-visual uxb-visual--flow-lanes" data-visual="beacon-field-guide" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="beacon-field-guide-title">A developer's first map of Beacon</title>
<desc id="beacon-field-guide-desc">Start at the API: it is the only part that acts for an agent, and the only part that calls the model gateway.</desc>
