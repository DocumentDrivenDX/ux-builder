<text x="665.71" y="196" text-anchor="middle" style="fill:#6B675E;font-size:12px;font-weight:400;paint-order:stroke;stroke:#FFFFFF;stroke-width:6px;stroke-linejoin:round">forwards with</text>
<text x="665.71" y="212" text-anchor="middle" style="fill:#6B675E;font-size:12px;font-weight:400;paint-order:stroke;stroke:#FFFFFF;stroke-width:6px;stroke-linejoin:round">the agent's token</text>
</g>
