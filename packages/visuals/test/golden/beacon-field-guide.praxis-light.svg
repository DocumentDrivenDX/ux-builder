<text x="750.17" y="222.1" style="fill:#141413;font-size:18px;font-weight:600">Beacon API</text>
<text x="750.17" y="237.1" style="fill:#6B675E;font-size:13px;font-weight:400">every request runs as the agent</text>
</g>
