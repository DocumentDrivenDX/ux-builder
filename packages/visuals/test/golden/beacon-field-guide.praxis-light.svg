<text x="1147.28" y="279.1" style="fill:#141413;font-size:18px;font-weight:600">Telemetry collector</text>
<text x="1147.28" y="294.1" style="fill:#3D3D3A;font-size:13px;font-weight:400">traces and audit spans</text>
</g>
<g id="beacon-field-guide--secrets" class="uxb-node" data-role="platform" data-status="built">
