<text x="361.26" y="228.6" style="fill:#3D3D3A;font-size:13px;font-weight:400">checks identity, forwards the</text>
<text x="361.26" y="245.6" style="fill:#3D3D3A;font-size:13px;font-weight:400">agent's token</text>
</g>
<g id="beacon-field-guide--api" class="uxb-node" data-role="own" data-status="built">
