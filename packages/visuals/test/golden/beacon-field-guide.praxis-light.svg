<text x="1127.28" y="36" style="fill:#6B675E;font-size:12px;font-weight:600;font-family:ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;letter-spacing:0.12em">04 / PLATFORM</text>
</g>
