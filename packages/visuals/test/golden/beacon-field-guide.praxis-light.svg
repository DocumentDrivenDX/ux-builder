<text x="1117.28" y="80" text-anchor="end" style="fill:#6B675E;font-size:12px;font-weight:400;paint-order:stroke;stroke:#FFFFFF;stroke-width:6px;stroke-linejoin:round">asks for a draft</text>
</g>
<g class="uxb-label">
<text x="1117.28" y="352.5" text-anchor="end" style="fill:#6B675E;font-size:12px;font-weight:400;paint-order:stroke;stroke:#FFFFFF;stroke-width:6px;stroke-linejoin:round">reads the gateway key</text>
</g>
<g class="uxb-label">
<text x="1117.28" y="269" text-anchor="end" style="fill:#6B675E;font-size:12px;font-weight:400;paint-order:stroke;stroke:#FFFFFF;stroke-width:6px;stroke-linejoin:round">audit spans, OTLP</text>
