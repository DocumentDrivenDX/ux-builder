</g>
<g class="uxb-label">
<text x="285.36" y="212" text-anchor="middle" style="fill:#6B675E;font-size:12px;font-weight:400;paint-order:stroke;stroke:#FFFFFF;stroke-width:6px;stroke-linejoin:round">opens a ticket</text>
</g>
