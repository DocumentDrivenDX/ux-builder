<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" width="800" height="278" role="img" aria-labelledby="helix-adr-options-title" aria-describedby="helix-adr-options-desc" class="uxb-visual uxb-visual--comparison-matrix" data-visual="helix-adr-options" style="font-family:&quot;DM Sans&quot;, system-ui, sans-serif">
<title id="helix-adr-options-title">ADR-002: options considered</title>
<desc id="helix-adr-options-desc">Which tracker write-safety option, and why?</desc>
<rect x="0" y="0" width="800" height="278" style="fill:#18181B"/>
<g id="helix-adr-options--matrix" class="uxb-matrix">
<rect x="0" y="0" width="800" height="78" style="fill:#27272A"/>
<text x="212" y="27" style="fill:#FFFFFF;font-size:13px;font-weight:600">Replace the tracker immediately with a</text>
<text x="212" y="44" style="fill:#FFFFFF;font-size:13px;font-weight:600">database-backed system</text>
<rect x="500" y="0" width="300" height="4" style="fill:#1685DF;stroke:#1685DF;stroke-width:0.01px"/>
<text x="512" y="27" style="fill:#FFFFFF;font-size:13px;font-weight:600">Keep JSONL but define and enforce a</text>
<text x="512" y="44" style="fill:#FFFFFF;font-size:13px;font-weight:600">conservative write-safety contract</text>
<text x="512" y="64" style="fill:#FAFAFA;font-size:12px;font-weight:400">Chosen: smallest sufficient hardening</text>
<path d="M0 78 L800 78" style="fill:none;stroke:#9F9FA9;stroke-width:1px"/>
<text x="12" y="101" style="fill:#FFFFFF;font-size:12px;font-weight:600">Pros</text>
<text x="212" y="101" style="fill:#FAFAFA;font-size:12px;font-weight:400">Stronger concurrency primitives</text>
<text x="512" y="101" style="fill:#FAFAFA;font-size:12px;font-weight:400">Preserves the current HELIX tracker shape,</text>
<text x="512" y="117" style="fill:#FAFAFA;font-size:12px;font-weight:400">addresses current failures, enables</text>
<text x="512" y="133" style="fill:#FAFAFA;font-size:12px;font-weight:400">deterministic testing</text>
<path d="M0 150 L800 150" style="fill:none;stroke:#9F9FA9;stroke-width:1px"/>
<text x="12" y="173" style="fill:#FFFFFF;font-size:12px;font-weight:600">Cons</text>
<text x="212" y="173" style="fill:#FAFAFA;font-size:12px;font-weight:400">Much larger implementation jump, higher</text>
<text x="212" y="189" style="fill:#FAFAFA;font-size:12px;font-weight:400">distribution complexity, changes HELIX surface</text>
<text x="212" y="205" style="fill:#FAFAFA;font-size:12px;font-weight:400">area substantially</text>
<text x="512" y="173" style="fill:#FAFAFA;font-size:12px;font-weight:400">Requires explicit conflict/corruption handling</text>
<text x="512" y="189" style="fill:#FAFAFA;font-size:12px;font-weight:400">and careful write-path design</text>
<path d="M0 222 L800 222" style="fill:none;stroke:#9F9FA9;stroke-width:1px"/>
<text x="12" y="245" style="fill:#FFFFFF;font-size:12px;font-weight:600">Evaluation</text>
<text x="212" y="245" style="fill:#FAFAFA;font-size:12px;font-weight:400">Rejected for now: too large for the immediate</text>
<text x="212" y="261" style="fill:#FAFAFA;font-size:12px;font-weight:400">hardening goal</text>
<text x="512" y="245" style="fill:#FAFAFA;font-size:12px;font-weight:400">Selected: smallest sufficient hardening</text>
<path d="M0 278 L800 278" style="fill:none;stroke:#9F9FA9;stroke-width:1px"/>
</g>
</svg>
