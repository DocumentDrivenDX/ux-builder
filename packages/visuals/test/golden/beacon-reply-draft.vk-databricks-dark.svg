<g id="beacon-reply-draft--m8" class="uxb-message" data-kind="return" data-steps="s8">
<path d="M842.5 448 L587.5 448" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:4 4"/>
<path d="M587.5 444.22 L578.5 448 L587.5 451.78 Z" style="fill:#9F9FA9;stroke:#9F9FA9;stroke-width:1.5px"/>
<rect x="669.75" y="424" width="103.51" height="18" rx="4" style="fill:#09090B"/>
<text x="673.75" y="438" style="fill:#FAFAFA;font-size:12px;font-weight:400">returns the draft</text>
<circle cx="654.75" cy="433" r="11" style="fill:#1685DF"/>
<text x="654.75" y="437.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">8</text>
