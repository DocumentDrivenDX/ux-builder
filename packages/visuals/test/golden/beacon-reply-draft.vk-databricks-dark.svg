<path d="M100.5 140 L313.5 140" style="fill:none;stroke:#FAFAFA;stroke-width:2px"/>
<path d="M313.5 143.78 L322.5 140 L313.5 136.22 Z" style="fill:#FAFAFA;stroke:#FAFAFA;stroke-width:2px"/>
<rect x="177.6" y="116" width="89.79" height="18" rx="4" style="fill:#09090B"/>
<text x="181.6" y="130" style="fill:#FAFAFA;font-size:12px;font-weight:400">opens a ticket</text>
<circle cx="162.6" cy="125" r="11" style="fill:#1685DF"/>
<text x="162.6" y="129.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">1</text>
</g>
