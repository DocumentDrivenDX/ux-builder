<path d="M322.5 184 L569.5 184" style="fill:none;stroke:#FAFAFA;stroke-width:2px"/>
<path d="M569.5 187.78 L578.5 184 L569.5 180.22 Z" style="fill:#FAFAFA;stroke:#FAFAFA;stroke-width:2px"/>
<rect x="367.15" y="160" width="188.7" height="18" rx="4" style="fill:#09090B"/>
<text x="371.15" y="174" style="fill:#FAFAFA;font-size:12px;font-weight:400">forwards with the agent's token</text>
<circle cx="352.15" cy="169" r="11" style="fill:#1685DF"/>
<text x="352.15" y="173.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">2</text>
</g>
<g id="beacon-reply-draft--m3" class="uxb-message" data-kind="call" data-steps="s3">
<path d="M578.5 228 L833.5 228" style="fill:none;stroke:#FAFAFA;stroke-width:2px"/>
<path d="M833.5 231.78 L842.5 228 L833.5 224.22 Z" style="fill:#FAFAFA;stroke:#FAFAFA;stroke-width:2px"/>
<rect x="674.31" y="204" width="94.37" height="18" rx="4" style="fill:#09090B"/>
<text x="678.31" y="218" style="fill:#FAFAFA;font-size:12px;font-weight:400">asks for a draft</text>
<circle cx="659.31" cy="213" r="11" style="fill:#1685DF"/>
<text x="659.31" y="217.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">3</text>
</g>
<g id="beacon-reply-draft--m4" class="uxb-message" data-kind="call" data-steps="s4">
<path d="M842.5 272 L1077.5 272" style="fill:none;stroke:#FAFAFA;stroke-width:2px"/>
<path d="M1077.5 275.78 L1086.5 272 L1077.5 268.22 Z" style="fill:#FAFAFA;stroke:#FAFAFA;stroke-width:2px"/>
<rect x="916.41" y="248" width="118.17" height="18" rx="4" style="fill:#09090B"/>
<text x="920.41" y="262" style="fill:#FAFAFA;font-size:12px;font-weight:400">loads ticket history</text>
<circle cx="901.41" cy="257" r="11" style="fill:#1685DF"/>
<text x="901.41" y="261.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">4</text>
</g>
<g id="beacon-reply-draft--m5" class="uxb-message" data-kind="call" data-steps="s5">
<path d="M842.5 316 L1326.5 316" style="fill:none;stroke:#FAFAFA;stroke-width:2px"/>
<path d="M1326.5 319.78 L1335.5 316 L1326.5 312.22 Z" style="fill:#FAFAFA;stroke:#FAFAFA;stroke-width:2px"/>
<rect x="992.12" y="292" width="215.75" height="18" rx="4" style="fill:#09090B"/>
<text x="996.12" y="306" style="fill:#FAFAFA;font-size:12px;font-weight:400">hands over the ticket and its history</text>
<circle cx="977.12" cy="301" r="11" style="fill:#1685DF"/>
<text x="977.12" y="305.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">5</text>
</g>
<g id="beacon-reply-draft--m6" class="uxb-message" data-kind="call" data-steps="s6">
<path d="M1335.5 360 L1590 360" style="fill:none;stroke:#FAFAFA;stroke-width:2px"/>
<path d="M1590 363.78 L1599 360 L1590 356.22 Z" style="fill:#FAFAFA;stroke:#FAFAFA;stroke-width:2px"/>
<rect x="1422.46" y="336" width="111.57" height="18" rx="4" style="fill:#09090B"/>
<text x="1426.46" y="350" style="fill:#FAFAFA;font-size:12px;font-weight:400">sends the prompt</text>
<circle cx="1407.46" cy="345" r="11" style="fill:#1685DF"/>
<text x="1407.46" y="349.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">6</text>
</g>
<g id="beacon-reply-draft--m7" class="uxb-message" data-kind="call" data-steps="s7">
<path d="M1599 404 L1818.5 404" style="fill:none;stroke:#FAFAFA;stroke-width:2px"/>
<path d="M1818.5 407.78 L1827.5 404 L1818.5 400.22 Z" style="fill:#FAFAFA;stroke:#FAFAFA;stroke-width:2px"/>
<rect x="1669.21" y="380" width="110.09" height="18" rx="4" style="fill:#09090B"/>
<text x="1673.21" y="394" style="fill:#FAFAFA;font-size:12px;font-weight:400">routes to a model</text>
<circle cx="1654.21" cy="389" r="11" style="fill:#1685DF"/>
<text x="1654.21" y="393.2" text-anchor="middle" style="fill:#09090B;font-size:12px;font-weight:600">7</text>
