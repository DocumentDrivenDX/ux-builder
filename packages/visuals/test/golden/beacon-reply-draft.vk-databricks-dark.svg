<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1927 524" width="1927" height="524" role="img" aria-labelledby="beacon-reply-draft-title" aria-describedby="beacon-reply-draft-desc" class="uxb-visual uxb-visual--sequence-lifelines" data-visual="beacon-reply-draft" style="font-family:&quot;DM Sans&quot;, system-ui, sans-serif">
<title id="beacon-reply-draft-title">Drafting a reply</title>
<desc id="beacon-reply-draft-desc">Eight hand-offs from an open ticket to a draft the agent can edit, and every one runs as the agent.</desc>
<rect x="0" y="0" width="1927" height="524" style="fill:#09090B"/>
<g id="beacon-reply-draft--agent" class="uxb-participant" data-role="actor" data-status="built">
<path d="M100.5 104 L100.5 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="24" y="66" width="153" height="38" rx="8" style="fill:#18181B;stroke:#9F9FA9;stroke-width:1.5px"/>
<circle cx="47" cy="82.4" r="3.96" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px"/>
<path d="M40.16 95 C40.16 88.16 53.84 88.16 53.84 95" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px"/>
<text x="62" y="90" style="fill:#FFFFFF;font-size:14px;font-weight:600">Support agent</text>
</g>
<g id="beacon-reply-draft--proxy" class="uxb-participant" data-role="platform" data-status="built">
<path d="M322.5 104 L322.5 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="225" y="32" width="195" height="72" rx="8" style="fill:#27272A;stroke:#9F9FA9;stroke-width:1.5px"/>
<text x="239" y="56" style="fill:#FFFFFF;font-size:14px;font-weight:600">Sign-in proxy</text>
<text x="239" y="70" style="fill:#FAFAFA;font-size:12px;font-weight:400">checks identity, forwards the</text>
<text x="239" y="86" style="fill:#FAFAFA;font-size:12px;font-weight:400">agent's token</text>
</g>
<g id="beacon-reply-draft--web" class="uxb-participant" data-role="own" data-status="built">
<path d="M578.5 104 L578.5 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="468" y="48" width="221" height="56" rx="8" style="fill:#18181B;stroke:#1685DF;stroke-width:2px"/>
<text x="482" y="72" style="fill:#FFFFFF;font-size:14px;font-weight:600">Web app</text>
<text x="482" y="86" style="fill:#9F9FA9;font-size:12px;font-weight:400">the agent's inbox and draft editor</text>
</g>
<g id="beacon-reply-draft--api" class="uxb-participant" data-role="own" data-status="built">
<path d="M842.5 104 L842.5 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="737" y="48" width="211" height="56" rx="8" style="fill:#18181B;stroke:#1685DF;stroke-width:2px"/>
<text x="751" y="72" style="fill:#FFFFFF;font-size:14px;font-weight:600">Beacon API</text>
<text x="751" y="86" style="fill:#9F9FA9;font-size:12px;font-weight:400">every request runs as the agent</text>
</g>
<g id="beacon-reply-draft--db" class="uxb-participant" data-role="store" data-status="built">
<path d="M1086.5 104 L1086.5 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="996" y="48" width="181" height="56" rx="8" style="fill:#18181B;stroke:#9F9FA9;stroke-width:1.5px"/>
<path d="M1010 62 L1010 74 C1010 78 1028 78 1028 74 L1028 62" style="fill:#18181B;stroke:#9F9FA9;stroke-width:1.5px"/>
<ellipse cx="1019" cy="62" rx="9" ry="3" style="fill:#18181B;stroke:#9F9FA9;stroke-width:1.5px"/>
<text x="1034" y="72" style="fill:#FFFFFF;font-size:14px;font-weight:600">Beacon database</text>
<text x="1034" y="86" style="fill:#9F9FA9;font-size:12px;font-weight:400">tickets, drafts, reviews</text>
</g>
<g id="beacon-reply-draft--drafter" class="uxb-participant" data-role="own" data-status="built">
<path d="M1335.5 104 L1335.5 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="1225" y="32" width="221" height="72" rx="8" style="fill:#18181B;stroke:#1685DF;stroke-width:2px"/>
<text x="1239" y="56" style="fill:#FFFFFF;font-size:14px;font-weight:600">Reply drafter</text>
<text x="1239" y="70" style="fill:#9F9FA9;font-size:12px;font-weight:400">builds the prompt from the ticket</text>
<text x="1239" y="86" style="fill:#9F9FA9;font-size:12px;font-weight:400">and its history</text>
</g>
<g id="beacon-reply-draft--gateway" class="uxb-participant" data-role="platform" data-status="built">
<path d="M1599 104 L1599 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="1494" y="48" width="210" height="56" rx="8" style="fill:#27272A;stroke:#9F9FA9;stroke-width:1.5px"/>
<text x="1508" y="72" style="fill:#FFFFFF;font-size:14px;font-weight:600">Model gateway</text>
<text x="1508" y="86" style="fill:#FAFAFA;font-size:12px;font-weight:400">rate limits, usage, model choice</text>
</g>
<g id="beacon-reply-draft--models" class="uxb-participant" data-role="platform" data-status="built">
<path d="M1827.5 104 L1827.5 500" style="fill:none;stroke:#9F9FA9;stroke-width:1.5px;stroke-dasharray:3 4"/>
<rect x="1752" y="66" width="151" height="38" rx="8" style="fill:#27272A;stroke:#9F9FA9;stroke-width:1.5px"/>
<text x="1766" y="90" style="fill:#FFFFFF;font-size:14px;font-weight:600">Language models</text>
</g>
