<path d="M1372 70 L1158.5 70 Q1156 70 1156 67.5 L1156 67.5 Q1156 65 1153.5 65 L1145 65" style="fill:none;stroke:#706C62;stroke-width:1.5px;stroke-dasharray:4 4"/>
