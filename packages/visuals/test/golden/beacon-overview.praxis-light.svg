<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3024 173" width="3024" height="173" role="img" aria-labelledby="beacon-overview-title" aria-describedby="beacon-overview-desc" class="uxb-visual uxb-visual--flow-pipeline" data-visual="beacon-overview" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="beacon-overview-title">One draft, end to end</title>
<desc id="beacon-overview-desc">A draft is asked for by the agent, built by the drafter, and written by a model the gateway chooses.</desc>
<rect x="0" y="0" width="3024" height="173" style="fill:#F0EEE6"/>
<g id="beacon-overview--agent--proxy" class="uxb-edge" data-steps="s1">
<path d="M177 100 L390 100" style="fill:none;stroke:#6B675E;stroke-width:1.5px"/>
<path d="M390 103.78 L399 100 L390 96.22 Z" style="fill:#6B675E;stroke:#6B675E;stroke-width:1.5px"/>
<rect x="241" y="91" width="94" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="288" y="104.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">opens a ticket</text>
</g>
<g id="beacon-overview--gateway--models" class="uxb-edge" data-steps="s4">
<path d="M2606 70 L2840 70" style="fill:none;stroke:#6B675E;stroke-width:1.5px"/>
<path d="M2840 73.78 L2849 70 L2840 66.22 Z" style="fill:#6B675E;stroke:#6B675E;stroke-width:1.5px"/>
<rect x="2670" y="61" width="115" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="2727.5" y="74.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">routes to a model</text>
</g>
<g id="beacon-overview--proxy--web" class="uxb-edge">
<path d="M594 88 L606 88 Q614 88 614 80 L614 64 Q614 56 622 56 L906 56" style="fill:none;stroke:#6B675E;stroke-width:1.5px"/>
<path d="M906 59.78 L915 56 L906 52.22 Z" style="fill:#6B675E;stroke:#6B675E;stroke-width:1.5px"/>
<rect x="668" y="47" width="193" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="764.5" y="60.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">forwards with the agent's token</text>
</g>
<g id="beacon-overview--proxy--api" class="uxb-edge" data-steps="s2">
<path d="M594 112 L1320 112 Q1328 112 1328 104 L1328 92 Q1328 84 1336 84 L1363 84" style="fill:none;stroke:#6B675E;stroke-width:1.5px"/>
<path d="M1363 87.78 L1372 84 L1363 80.22 Z" style="fill:#6B675E;stroke:#6B675E;stroke-width:1.5px"/>
<rect x="644" y="103" width="193" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="740.5" y="116.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">forwards with the agent's token</text>
</g>
<g id="beacon-overview--web--api" class="uxb-edge">
<path d="M1136 47 L1323.5 47 Q1328 47 1328 51.5 L1328 51.5 Q1328 56 1332.5 56 L1363 56" style="fill:none;stroke:#6B675E;stroke-width:1.5px"/>
<path d="M1363 59.78 L1372 56 L1363 52.22 Z" style="fill:#6B675E;stroke:#6B675E;stroke-width:1.5px"/>
<rect x="1183" y="38" width="99" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="1232.5" y="51.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">asks for a draft</text>
</g>
