<rect x="2192" y="52" width="116" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="2250" y="65.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">sends the prompt</text>
</g>
<g id="beacon-overview--api--gateway" class="uxb-edge" data-steps="s3">
<path d="M1583 79 L1595 79 Q1603 79 1603 87 L1603 117 Q1603 125 1611 125 L2344 125 Q2352 125 2352 117 L2352 87 Q2352 79 2360 79 L2387 79" style="fill:none;stroke:#6B675E;stroke-width:1.5px"/>
<path d="M2387 82.78 L2396 79 L2387 75.22 Z" style="fill:#6B675E;stroke:#6B675E;stroke-width:1.5px"/>
<rect x="1778" y="116" width="99" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="1827.5" y="129.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">asks for a draft</text>
</g>
<g id="beacon-overview--agent" class="uxb-node" data-role="actor" data-status="built">
<rect x="24" y="81" width="153" height="38" rx="8" style="fill:#FFFFFF;stroke:#706C62;stroke-width:1.5px"/>
<circle cx="47" cy="97.4" r="3.96" style="fill:none;stroke:#706C62;stroke-width:1.5px"/>
<path d="M40.16 110 C40.16 103.16 53.84 103.16 53.84 110" style="fill:none;stroke:#706C62;stroke-width:1.5px"/>
<text x="62" y="105" style="fill:#141413;font-size:14px;font-weight:600">Support agent</text>
</g>
<g id="beacon-overview--proxy" class="uxb-node" data-role="platform" data-status="built">
<rect x="399" y="64" width="195" height="72" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="413" y="88" style="fill:#141413;font-size:14px;font-weight:600">Sign-in proxy</text>
<text x="413" y="102" style="fill:#3D3D3A;font-size:12px;font-weight:400">checks identity, forwards the</text>
<text x="413" y="118" style="fill:#3D3D3A;font-size:12px;font-weight:400">agent's token</text>
</g>
<g id="beacon-overview--web" class="uxb-node" data-role="own" data-status="built">
<rect x="915" y="28" width="221" height="56" rx="8" style="fill:#FFFFFF;stroke:#D12800;stroke-width:2px"/>
<text x="929" y="52" style="fill:#141413;font-size:14px;font-weight:600">Web app</text>
<text x="929" y="66" style="fill:#6B675E;font-size:12px;font-weight:400">the agent's inbox and draft editor</text>
</g>
<g id="beacon-overview--api" class="uxb-node" data-role="own" data-status="built">
<rect x="1372" y="42" width="211" height="56" rx="8" style="fill:#FFFFFF;stroke:#D12800;stroke-width:2px"/>
<text x="1386" y="66" style="fill:#141413;font-size:14px;font-weight:600">Beacon API</text>
<text x="1386" y="80" style="fill:#6B675E;font-size:12px;font-weight:400">every request runs as the agent</text>
</g>
<g id="beacon-overview--drafter" class="uxb-node" data-role="own" data-status="built">
<rect x="1931" y="25" width="221" height="72" rx="8" style="fill:#FFFFFF;stroke:#D12800;stroke-width:2px"/>
<text x="1945" y="49" style="fill:#141413;font-size:14px;font-weight:600">Reply drafter</text>
<text x="1945" y="63" style="fill:#6B675E;font-size:12px;font-weight:400">builds the prompt from the ticket</text>
<text x="1945" y="79" style="fill:#6B675E;font-size:12px;font-weight:400">and its history</text>
</g>
<g id="beacon-overview--gateway" class="uxb-node" data-role="platform" data-status="built">
<rect x="2396" y="42" width="210" height="56" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="2410" y="66" style="fill:#141413;font-size:14px;font-weight:600">Model gateway</text>
<text x="2410" y="80" style="fill:#3D3D3A;font-size:12px;font-weight:400">rate limits, usage, model choice</text>
</g>
<g id="beacon-overview--models" class="uxb-node" data-role="platform" data-status="built">
<rect x="2849" y="51" width="151" height="38" rx="8" style="fill:#FAF9F5;stroke:#706C62;stroke-width:1.5px"/>
<text x="2863" y="75" style="fill:#141413;font-size:14px;font-weight:600">Language models</text>
</g>
