<rect x="1210" y="61" width="108" height="18" rx="4" style="fill:#F0EEE6"/>
<text x="1264" y="74.2" text-anchor="middle" style="fill:#3D3D3A;font-size:12px;font-weight:400">returns the draft</text>
</g>
<g id="beacon-overview--api--drafter" class="uxb-edge">
<path d="M1583 61 L1922 61" style="fill:none;stroke:#6B675E;stroke-width:1.5px"/>
<path d="M1922 64.78 L1931 61 L1922 57.22 Z" style="fill:#6B675E;stroke:#6B675E;stroke-width:1.5px"/>
