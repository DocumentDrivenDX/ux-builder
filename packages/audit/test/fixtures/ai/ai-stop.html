<!doctype html>
<!-- Seeded defect (ai-stop): the Stop control is away from the busy status, in the header. -->
<html lang="en" data-theme="praxis-carbon" data-appearance="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defect</title>
<link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/ui.css">
<style>body { margin: 0; padding: 16px; font-family: var(--piq-font-body); color: var(--piq-color-text); background: var(--piq-color-ground); } p { margin: 0 0 8px; } button, input, select, textarea { font: inherit; min-block-size: 44px; min-inline-size: 44px; box-sizing: border-box; max-inline-size: 100%; }</style>
</head>
<body>
<header><button id="stop">Stop</button></header>
<main>
<h1>Assistant</h1>
<p id="status" data-piq-ai="status" aria-live="polite" aria-busy="true">Writing an answer</p>
<section id="conversation" aria-label="Conversation" data-piq-ai-label>
  <p id="disclosure">Answers are AI-generated and may need checking.</p>
  <article id="answer" data-piq-ai="generated">
    <p>Here is the expense, filled in from your receipt.</p>
    <form id="expense" data-piq-ai="generated">
      <label for="amount">Amount</label> <input id="amount" name="amount" value="42.50">
      <label for="category">Category</label> <select id="category" name="category"><option value="">Choose</option><option value="travel" selected>Travel</option></select>
      <button id="submit-expense" type="submit">Submit expense</button>
    </form>
    <button id="regenerate" type="button" data-piq-ai-control="regenerate">Regenerate</button>
  </article>
</section>
<form id="composer"><textarea id="prompt" data-piq-ai="prompt" aria-label="Ask the assistant"></textarea> <button id="send">Send</button></form>
</main>
</body>
</html>
